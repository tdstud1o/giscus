# Netlify 部署配置
#
# giscus fork 基于 Next.js 12，Netlify 对 Next < 13.5 走 Legacy Runtime v4
# （OpenNext adapter 只支持 13.5+，见 https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/legacy-runtime/overview/）
#
# 构建命令刻意跳过 `mscript`（google-closure-compiler）：
# 它依赖 JVM，Netlify 构建镜像不保证有，跳过只影响 public/client.js 的压缩率，不影响功能。

[build]
  command = "yarn cscript && yarn cthemes && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs@4.41.3"
