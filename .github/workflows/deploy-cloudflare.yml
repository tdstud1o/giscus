name: deploy-cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-giscus
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 检查密钥是否就绪
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::缺少 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过部署"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装依赖
        if: steps.guard.outputs.ready == 'true'
        run: corepack enable && yarn install --frozen-lockfile

      - name: 构建静态产物
        if: steps.guard.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_ANON_ENDPOINT: https://blog.tmoc.qzz.io/api/comment
        run: yarn build:cf

      - name: 部署 Worker
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: 同步 Worker 密钥
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          ENCRYPTION_PASSWORD: ${{ secrets.GH_APP_ENCRYPTION_PASSWORD }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
        run: |
          for name in GITHUB_PRIVATE_KEY ENCRYPTION_PASSWORD GITHUB_CLIENT_SECRET; do
            value="$(printenv "$name" || true)"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4 secret put "$name"
            fi
          done
